appId: com.judiciary.ccms
productName: Company Court Management System
copyright: Copyright © 2026 Company Court Administrative Wing
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Company Court Management System (CCMS)
  uninstallDisplayName: Company Court Management System (CCMS)
  deleteAppDataOnUninstall: false
